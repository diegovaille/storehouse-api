# Perfil só para CatalogoPublicoSecurityTest.
#
# Deliberadamente NÃO usa o profile "test": SecurityConfig, DefaultStorageService,
# ProjectBucketProperties e StorageClientFactory são todos `@Profile("!test")` — sob
# "test" eles ficam desligados (ver TestStorageService/BeansConfig), e é exatamente
# SecurityConfig que este teste precisa ver rodando de verdade (a regra do endpoint
# público/fechado é dele, não de um standalone MockMvc). "sectest" satisfaz "!test" e
# ativa os mesmos beans de produção, com valores dummy suficientes para eles construírem
# sem tocar rede de verdade (S3Client e o ClientRegistrationRepository do Google OAuth2
# não fazem chamada nenhuma na criação, só na primeira requisição real).
spring:
  liquibase:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-client-id
            client-secret: dummy-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: email

# Igual a application-{dev,prod}.yml: ativa o ForwardedHeaderFilter do Spring Boot, que
# reescreve request.remoteAddr a partir de X-Forwarded-For. RateLimitFilterSecurityTest
# depende disso para provar a chave por IP real (armadilha 1) através da cadeia real do
# Spring Security, não de um MockMvc que ignora o filtro.
server:
  forward-headers-strategy: framework

# Sem bloco `rate-limit:` aqui de propósito — fica nos defaults de produção (60/60s
# publico, 10/5min login, ver RateLimitProperties). O RateLimitFilter é um bean singleton
# e o contexto Spring deste profile ("sectest") é cacheado e REUTILIZADO entre todos os
# testes de segurança que casam a mesma assinatura de configuração — inclusive
# CatalogoPublicoControllerSecurityTest, cujas chamadas a /api/publico/** não setam
# X-Forwarded-For e por isso caem todas no mesmo bucket "default IP". Uma cota baixa aqui
# (ex.: 3) estoura esse bucket compartilhado e quebra testes de OUTRA classe que nada sabem
# sobre rate limiting — já aconteceu ao tentar isso, ver histórico do PR. RateLimitFilterSecurityTest
# em vez disso dispara o 429 batendo a cota REAL (60/10) a partir de um IP sintético
# próprio, o que também evita qualquer interferência cruzada com o resto da suíte.
app:
  frontend-base-url: http://localhost:8080

project:
  storage:
    despesa-bucket: test-bucket
    default-bucket: test-bucket
    buckets:
      - name: test-bucket
        region: us-east-1
        provider: aws
        accessKey: test
        secretKey: test
        endpoint: http://localhost:4566

jwt:
  secret: sectest-secret-key-for-security-filter-chain-tests-only
  expiration: 3600000

openai:
  api-key: test-key

isbndb:
  api-key: test-key
